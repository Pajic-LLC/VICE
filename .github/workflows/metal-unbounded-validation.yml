name: Metal unbounded descriptor validation

on:
  workflow_dispatch:
    inputs:
      dxc_path:
        description: Official DXC executable name or absolute path on the runner
        required: false
        default: dxc
        type: string
      metal_shader_converter_path:
        description: Official Apple metal-shaderconverter name or absolute path on the runner
        required: false
        default: metal-shaderconverter
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Official MSC unbounded GPU execution
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate converter-produced unbounded descriptor execution
        env:
          VICE_DXC: ${{ inputs.dxc_path }}
          VICE_METAL_SHADER_CONVERTER: ${{ inputs.metal_shader_converter_path }}
          VICE_VALIDATION_BUILD_DIR: build-metal-unbounded-validation
        run: bash scripts/validate_metal_unbounded.sh
