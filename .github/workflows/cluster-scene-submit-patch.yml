name: Apply cluster scene integration patch

on:
  push:
    branches:
      - feat/242-cluster-scene-submit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded scene patch
        run: python scripts/apply_cluster_scene_submit.py
      - name: Remove one-shot patch helper
        run: |
          rm scripts/apply_cluster_scene_submit.py
          rm .github/workflows/cluster-scene-submit-patch.yml
      - name: Commit patched Runtime integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Integrate cluster scene submission (#242)"
          git push origin HEAD:feat/242-cluster-scene-submit
