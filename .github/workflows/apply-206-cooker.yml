name: Apply 206 cooker layer

on:
  push:
    branches:
      - feature/206-metal-unbounded-descriptors

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/206-metal-unbounded-descriptors
      - name: Apply cooker and manifest layer
        run: python3 .github/scripts/apply_206_cooker.py
      - name: Commit layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render/include/vice/render/rhi.hpp \
                  engine/render/src/shader_asset.cpp \
                  tools/shader_cooker/include/vice/tools/metal_reflection.hpp \
                  tools/shader_cooker/src/metal_reflection.cpp \
                  tools/shader_cooker/src/shader_cooker.cpp \
                  tests/shader_cooker_tests.cpp \
                  tests/shader_asset_tests.cpp
          git commit -m "Add Metal explicit descriptor-table cooker metadata"
          git push
