name: Apply GPU material texture slots

on:
  push:
    branches:
      - feat/250-resource-budgets
    paths:
      - scripts/apply_gpu_material_texture_slots.py
      - .github/workflows/gpu-material-texture-slots.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/250-resource-budgets
          fetch-depth: 0
      - name: Apply guarded GPU material texture-slot patch
        run: python3 scripts/apply_gpu_material_texture_slots.py
      - name: Remove one-shot helpers
        run: |
          rm scripts/apply_gpu_material_texture_slots.py
          rm .github/workflows/gpu-material-texture-slots.yml
      - name: Commit texture-slot integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/runtime/src/gpu_material_table.cpp scripts/apply_gpu_material_texture_slots.py .github/workflows/gpu-material-texture-slots.yml
          git commit -m "Track GPU material texture semantics (#250)"
          git push origin HEAD:feat/250-resource-budgets
