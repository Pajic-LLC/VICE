name: Apply indexed indirect foundation

on:
  push:
    branches:
      - feature/200-indexed-indirect-draw

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/200-indexed-indirect-draw

      - name: Patch portable indexed indirect execution
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing patch context in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))

          rhi = Path('engine/render/include/vice/render/rhi.hpp')
          replace_once(
              rhi,
              '    copy_source = 1U << 4U,\n    copy_destination = 1U << 5U,\n};',
              '    copy_source = 1U << 4U,\n    copy_destination = 1U << 5U,\n    indirect = 1U << 6U,\n};'
          )
          replace_once(
              rhi,
              'struct BufferDesc {\n    std::uint64_t size = 0;\n    BufferUsage usage = BufferUsage::none;\n    MemoryLocation memory = MemoryLocation::gpu_only;\n    std::string_view debug_name;\n};\n',
              'struct BufferDesc {\n    std::uint64_t size = 0;\n    BufferUsage usage = BufferUsage::none;\n    MemoryLocation memory = MemoryLocation::gpu_only;\n    std::string_view debug_name;\n};\n\nstruct IndexedIndirectDrawArguments {\n    std::uint32_t index_count = 0U;\n    std::uint32_t instance_count = 0U;\n    std::uint32_t first_index = 0U;\n    std::int32_t vertex_offset = 0;\n    std::uint32_t first_instance = 0U;\n};\n\nstatic_assert(sizeof(IndexedIndirectDrawArguments) == 5U * sizeof(std::uint32_t));\n'
          )
          replace_once(
              rhi,
              '    virtual bool draw_indexed(\n        std::uint32_t index_count,\n        std::uint32_t instance_count = 1,\n        std::uint32_t first_index = 0,\n        std::int32_t vertex_offset = 0,\n        std::uint32_t first_instance = 0\n    ) {\n        (void)index_count;\n        (void)instance_count;\n        (void)first_index;\n        (void)vertex_offset;\n        (void)first_instance;\n        return false;\n    }\n    virtual bool end_render_pass() = 0;',
              '    virtual bool draw_indexed(\n        std::uint32_t index_count,\n        std::uint32_t instance_count = 1,\n        std::uint32_t first_index = 0,\n        std::int32_t vertex_offset = 0,\n        std::uint32_t first_instance = 0\n    ) {\n        (void)index_count;\n        (void)instance_count;\n        (void)first_index;\n        (void)vertex_offset;\n        (void)first_instance;\n        return false;\n    }\n    virtual bool draw_indexed_indirect(\n        Buffer& arguments,\n        std::uint64_t offset = 0U\n    ) {\n        (void)arguments;\n        (void)offset;\n        return false;\n    }\n    virtual bool end_render_pass() = 0;'
          )

          d3d = Path('engine/render/src/d3d12/rhi.cpp')
          replace_once(
              d3d,
              'constexpr std::uint64_t maximum_constant_buffer_size = 64U * 1024U;\n',
              'constexpr std::uint64_t maximum_constant_buffer_size = 64U * 1024U;\nstatic_assert(sizeof(IndexedIndirectDrawArguments) == sizeof(D3D12_DRAW_INDEXED_ARGUMENTS));\n'
          )
          replace_once(
              d3d,
              '        sampler_descriptor_size_ = device_->GetDescriptorHandleIncrementSize(\n            D3D12_DESCRIPTOR_HEAP_TYPE_SAMPLER\n        );\n        valid_ = true;\n',
              '        sampler_descriptor_size_ = device_->GetDescriptorHandleIncrementSize(\n            D3D12_DESCRIPTOR_HEAP_TYPE_SAMPLER\n        );\n        D3D12_INDIRECT_ARGUMENT_DESC argument{};\n        argument.Type = D3D12_INDIRECT_ARGUMENT_TYPE_DRAW_INDEXED;\n        D3D12_COMMAND_SIGNATURE_DESC signature{};\n        signature.ByteStride = sizeof(IndexedIndirectDrawArguments);\n        signature.NumArgumentDescs = 1U;\n        signature.pArgumentDescs = &argument;\n        if (!succeeded(\n                device_->CreateCommandSignature(\n                    &signature, nullptr, IID_PPV_ARGS(&draw_indexed_signature_)\n                ),\n                "Direct3D 12 could not create the VICE indexed indirect command signature."\n            )) {\n            return;\n        }\n        valid_ = true;\n'
          )
          replace_once(
              d3d,
              '    bool end_render_pass() override {\n        if (!render_pass_active_) {',
              '    bool draw_indexed_indirect(\n        Buffer& arguments,\n        const std::uint64_t offset\n    ) override {\n        auto* native_arguments = dynamic_cast<D3D12Buffer*>(&arguments);\n        if (!render_pass_active_ || !pipeline_bound_ || active_pipeline_ == nullptr ||\n            !index_buffer_bound_ || draw_indexed_signature_ == nullptr ||\n            native_arguments == nullptr || !has_usage(arguments.usage(), BufferUsage::indirect) ||\n            offset % alignof(std::uint32_t) != 0U || offset > arguments.size() ||\n            sizeof(IndexedIndirectDrawArguments) > arguments.size() - offset) {\n            return false;\n        }\n        if (!materialize_graphics_bindings()) {\n            return false;\n        }\n        transition(*native_arguments, D3D12_RESOURCE_STATE_INDIRECT_ARGUMENT);\n        command_list_->ExecuteIndirect(\n            draw_indexed_signature_.Get(),\n            1U,\n            native_arguments->native(),\n            offset,\n            nullptr,\n            0U\n        );\n        return true;\n    }\n\n    bool end_render_pass() override {\n        if (!render_pass_active_) {'
          )
          replace_once(
              d3d,
              '    ComPtr<ID3D12GraphicsCommandList> command_list_;\n    std::vector<PendingBinding> pending_bindings_;',
              '    ComPtr<ID3D12GraphicsCommandList> command_list_;\n    ComPtr<ID3D12CommandSignature> draw_indexed_signature_;\n    std::vector<PendingBinding> pending_bindings_;'
          )

          metal = Path('engine/render/src/metal/rhi.mm')
          replace_once(
              metal,
              'constexpr std::uint64_t metal_descriptor_entry_size = 3U * sizeof(std::uint64_t);\n',
              'constexpr std::uint64_t metal_descriptor_entry_size = 3U * sizeof(std::uint64_t);\nstatic_assert(sizeof(IndexedIndirectDrawArguments) == sizeof(MTLDrawIndexedPrimitivesIndirectArguments));\n'
          )
          replace_once(
              metal,
              '    bool end_render_pass() override {\n        if (render_encoder_ == nil) {',
              '    bool draw_indexed_indirect(\n        Buffer& arguments,\n        const std::uint64_t offset\n    ) override {\n        auto* metal_arguments = dynamic_cast<MetalBuffer*>(&arguments);\n        if (render_encoder_ == nil || !pipeline_bound_ || active_pipeline_ == nullptr ||\n            !index_buffer_bound_ || index_buffer_ == nullptr || index_buffer_->native() == nil ||\n            metal_arguments == nullptr || metal_arguments->native() == nil ||\n            !has_usage(arguments.usage(), BufferUsage::indirect) ||\n            offset % alignof(std::uint32_t) != 0U || offset > arguments.size() ||\n            sizeof(IndexedIndirectDrawArguments) > arguments.size() - offset ||\n            offset > static_cast<std::uint64_t>(std::numeric_limits<NSUInteger>::max()) ||\n            index_offset_ > static_cast<std::uint64_t>(std::numeric_limits<NSUInteger>::max())) {\n            return false;\n        }\n        if (!prepare_draw_resources()) {\n            return false;\n        }\n        [render_encoder_ drawIndexedPrimitives:MTLPrimitiveTypeTriangle\n                                     indexType:index_type(index_format_)\n                                   indexBuffer:index_buffer_->native()\n                             indexBufferOffset:static_cast<NSUInteger>(index_offset_)\n                                indirectBuffer:metal_arguments->native()\n                          indirectBufferOffset:static_cast<NSUInteger>(offset)];\n        return true;\n    }\n\n    bool end_render_pass() override {\n        if (render_encoder_ == nil) {'
          )

          cmake = Path('tests/CMakeLists.txt')
          replace_once(
              cmake,
              'add_test(NAME vice_compute_rhi_smoke_tests COMMAND vice_compute_rhi_smoke_tests)\n',
              'add_test(NAME vice_compute_rhi_smoke_tests COMMAND vice_compute_rhi_smoke_tests)\n\nadd_executable(vice_indexed_indirect_draw_tests indexed_indirect_draw_tests.cpp)\ntarget_link_libraries(vice_indexed_indirect_draw_tests PRIVATE VICE::Render)\ntarget_compile_features(vice_indexed_indirect_draw_tests PRIVATE cxx_std_23)\nvice_enable_warnings(vice_indexed_indirect_draw_tests)\nadd_test(NAME vice_indexed_indirect_draw_tests COMMAND vice_indexed_indirect_draw_tests)\n'
          )
          PY

      - name: Commit foundation
        shell: bash
        run: |
          if git diff --quiet -- engine/render/include/vice/render/rhi.hpp engine/render/src/d3d12/rhi.cpp engine/render/src/metal/rhi.mm tests/CMakeLists.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render/include/vice/render/rhi.hpp engine/render/src/d3d12/rhi.cpp engine/render/src/metal/rhi.mm tests/CMakeLists.txt
          git commit -m "Add portable indexed indirect draw execution"
          git push origin HEAD:feature/200-indexed-indirect-draw
