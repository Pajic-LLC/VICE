name: Apply runtime visibility integration

on:
  push:
    branches:
      - feature/198-gpu-visibility

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/198-gpu-visibility

      - name: Patch RuntimeSceneRenderer
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("engine/runtime/src/scene.cpp")
          text = path.read_text()
          if "#include <vice/runtime/visibility.hpp>" in text:
              raise SystemExit(0)

          replacements = [
              (
                  "#include <vice/runtime/post_process.hpp>\n",
                  "#include <vice/runtime/post_process.hpp>\n#include <vice/runtime/visibility.hpp>\n",
              ),
              (
                  "        std::uint32_t index_count = 0;\n    };",
                  "        std::uint32_t index_count = 0;\n        RuntimeBoundingSphere bounds{};\n    };",
              ),
              (
                  "    detail::RuntimeEnvironment environment;\n",
                  "    detail::RuntimeEnvironment environment;\n    RuntimeVisibilityCuller visibility;\n",
              ),
              (
                  "    if (!state_->environment.initialize(device, content_root, diagnostics)) {\n        return false;\n    }\n\n    const bool metal",
                  "    if (!state_->environment.initialize(device, content_root, diagnostics)) {\n        return false;\n    }\n    if (!state_->visibility.initialize(device, diagnostics)) {\n        return false;\n    }\n\n    const bool metal",
              ),
              (
                  "                .index_count = static_cast<std::uint32_t>(record.asset.indices.size()),\n            }",
                  "                .index_count = static_cast<std::uint32_t>(record.asset.indices.size()),\n                .bounds = runtime_mesh_bounding_sphere(record.asset.vertices),\n            }",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing scene patch context: {old[:72]!r}")
              text = text.replace(old, new, 1)

          anchor = (
              "    auto commands = state_->device->create_command_list();\n"
              "    if (!commands) {\n"
              "        set_diagnostics(diagnostics, \"VICE Runtime could not create scene commands.\");\n"
              "        return false;\n"
              "    }\n"
          )
          addition = (
              "\n"
              "    if (instances.size() > std::numeric_limits<std::uint32_t>::max()) {\n"
              "        set_diagnostics(diagnostics, \"Runtime scene instance count exceeds the GPU visibility contract.\");\n"
              "        return false;\n"
              "    }\n"
              "    const auto visibility_frustum = runtime_visibility_frustum(\n"
              "        runtime_camera.forward,\n"
              "        runtime_camera.up,\n"
              "        runtime_camera.camera.vertical_fov_radians,\n"
              "        runtime_camera.aspect_ratio,\n"
              "        runtime_camera.camera.near_plane,\n"
              "        runtime_camera.camera.far_plane\n"
              "    );\n"
              "    if (!valid(visibility_frustum)) {\n"
              "        set_diagnostics(diagnostics, \"VICE Runtime could not build the camera visibility frustum.\");\n"
              "        return false;\n"
              "    }\n"
              "    std::vector<RuntimeVisibilitySphere> visibility_spheres;\n"
              "    visibility_spheres.reserve(instances.size());\n"
              "    for (std::size_t instance_index = 0U; instance_index < instances.size(); ++instance_index) {\n"
              "        const auto& instance = instances[instance_index];\n"
              "        const auto& mesh = state_->meshes.at(instance.mesh);\n"
              "        const auto sphere = runtime_transform_bounding_sphere(\n"
              "            mesh.bounds,\n"
              "            runtime_model_matrix_relative_to(instance, camera_global_position)\n"
              "        );\n"
              "        if (!valid(sphere)) {\n"
              "            set_diagnostics(diagnostics, \"VICE Runtime produced an invalid mesh visibility sphere.\");\n"
              "            return false;\n"
              "        }\n"
              "        visibility_spheres.push_back(RuntimeVisibilitySphere{\n"
              "            .center = sphere.center,\n"
              "            .radius = sphere.radius,\n"
              "            .instance_index = static_cast<std::uint32_t>(instance_index),\n"
              "        });\n"
              "    }\n"
              "    if (!state_->visibility.cull(\n"
              "            *commands,\n"
              "            visibility_spheres,\n"
              "            visibility_frustum,\n"
              "            diagnostics\n"
              "        )) {\n"
              "        return false;\n"
              "    }\n"
          )
          if anchor not in text:
              raise SystemExit("missing scene command-list patch context")
          text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text)
          PY

      - name: Commit Runtime integration
        shell: bash
        run: |
          if git diff --quiet -- engine/runtime/src/scene.cpp; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/runtime/src/scene.cpp
          git commit -m "Integrate GPU visibility into runtime scene"
          git push origin HEAD:feature/198-gpu-visibility
