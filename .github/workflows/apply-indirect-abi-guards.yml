name: Apply indirect ABI parity guards

on:
  push:
    branches:
      - feature/200-indexed-indirect-draw

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/200-indexed-indirect-draw
      - name: Add native field offset guards
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          d3d = Path('engine/render/src/d3d12/rhi.cpp')
          text = d3d.read_text()
          old = 'static_assert(sizeof(IndexedIndirectDrawArguments) == sizeof(D3D12_DRAW_INDEXED_ARGUMENTS));\n'
          new = '''static_assert(sizeof(IndexedIndirectDrawArguments) == sizeof(D3D12_DRAW_INDEXED_ARGUMENTS));
static_assert(offsetof(IndexedIndirectDrawArguments, index_count) == offsetof(D3D12_DRAW_INDEXED_ARGUMENTS, IndexCountPerInstance));
static_assert(offsetof(IndexedIndirectDrawArguments, instance_count) == offsetof(D3D12_DRAW_INDEXED_ARGUMENTS, InstanceCount));
static_assert(offsetof(IndexedIndirectDrawArguments, first_index) == offsetof(D3D12_DRAW_INDEXED_ARGUMENTS, StartIndexLocation));
static_assert(offsetof(IndexedIndirectDrawArguments, vertex_offset) == offsetof(D3D12_DRAW_INDEXED_ARGUMENTS, BaseVertexLocation));
static_assert(offsetof(IndexedIndirectDrawArguments, first_instance) == offsetof(D3D12_DRAW_INDEXED_ARGUMENTS, StartInstanceLocation));
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('missing D3D12 ABI guard context')
              d3d.write_text(text.replace(old, new, 1))

          metal = Path('engine/render/src/metal/rhi.mm')
          text = metal.read_text()
          old = 'static_assert(sizeof(IndexedIndirectDrawArguments) == sizeof(MTLDrawIndexedPrimitivesIndirectArguments));\n'
          new = '''static_assert(sizeof(IndexedIndirectDrawArguments) == sizeof(MTLDrawIndexedPrimitivesIndirectArguments));
static_assert(offsetof(IndexedIndirectDrawArguments, index_count) == offsetof(MTLDrawIndexedPrimitivesIndirectArguments, indexCount));
static_assert(offsetof(IndexedIndirectDrawArguments, instance_count) == offsetof(MTLDrawIndexedPrimitivesIndirectArguments, instanceCount));
static_assert(offsetof(IndexedIndirectDrawArguments, first_index) == offsetof(MTLDrawIndexedPrimitivesIndirectArguments, indexStart));
static_assert(offsetof(IndexedIndirectDrawArguments, vertex_offset) == offsetof(MTLDrawIndexedPrimitivesIndirectArguments, baseVertex));
static_assert(offsetof(IndexedIndirectDrawArguments, first_instance) == offsetof(MTLDrawIndexedPrimitivesIndirectArguments, baseInstance));
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('missing Metal ABI guard context')
              metal.write_text(text.replace(old, new, 1))
          PY
      - name: Commit ABI guards
        shell: bash
        run: |
          if git diff --quiet -- engine/render/src/d3d12/rhi.cpp engine/render/src/metal/rhi.mm; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render/src/d3d12/rhi.cpp engine/render/src/metal/rhi.mm
          git commit -m "Lock indexed indirect ABI to native layouts"
          git push origin HEAD:feature/200-indexed-indirect-draw
