name: Apply Metal compute RHI patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply Metal public compute RHI patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/compute-patches/metal.part00 \
              .github/compute-patches/metal.part01 \
              .github/compute-patches/metal.part02 \
              .github/compute-patches/metal.part03 \
              .github/compute-patches/metal.part04 > /tmp/metal-compute.patch

          if git apply --check /tmp/metal-compute.patch; then
            git apply /tmp/metal-compute.patch
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add engine/render/src/metal/rhi.mm
            git commit -m "Wire Metal compute through public RHI"
            git push origin HEAD:${{ github.head_ref }}
          else
            if grep -q 'class MetalComputePipeline final' engine/render/src/metal/rhi.mm && \
               grep -q 'bool dispatch(const ComputeDispatchDesc& dispatch_desc) override' engine/render/src/metal/rhi.mm; then
              echo "Metal compute RHI patch is already applied."
              exit 0
            fi
            echo "Patch no longer applies cleanly and expected integration markers are absent." >&2
            exit 1
          fi
