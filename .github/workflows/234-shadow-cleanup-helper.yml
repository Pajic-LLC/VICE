name: Apply #234 dead shadow cleanup

on:
  push:
    branches:
      - feat/234-gpu-motion-vectors

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[shadow-cleanup-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/234-gpu-motion-vectors
          fetch-depth: 0

      - name: Apply dead shadow cleanup
        run: python3 .github/scripts/apply_234_shadow_cleanup.py

      - name: Commit result
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/runtime/src/scene.cpp
          git commit -m "Remove dead per-draw shadow path (#234) [shadow-cleanup-applied]"
          git push origin HEAD:feat/234-gpu-motion-vectors
