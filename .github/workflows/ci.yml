name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
          - name: Windows x64
            os: windows-2025

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVICE_BUILD_TESTS=ON -DVICE_BUILD_LAB=ON -DVICE_BUILD_TOOLS=ON

      - name: Verify test discovery
        run: cmake -DVICE_TEST_BUILD_DIR=build -DVICE_TEST_CONFIG=Release -P cmake/VerifyTestDiscovery.cmake

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify agent World edit and build workflow
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path
          executable = Path("build/tools/vice_cli") / ("Release/vice.exe" if os.name == "nt" else "vice")
          subprocess.run([sys.executable, "scripts/validate_agent_world_workflow.py", "--vice", str(executable), "--physics"], check=True)
          subprocess.run([sys.executable, "scripts/validate_gameplay_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_distance_link_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_dependency_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_character_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_causal_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_material_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_vehicle_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_interaction_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_presentation_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_component_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_relation_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_clock_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_event_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_scheduler_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_quantity_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_rule_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_skinning_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_articulation_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_playback_workflow.py", "--vice", str(executable)], check=True)
          subprocess.run([sys.executable, "scripts/validate_swing_twist_workflow.py", "--vice", str(executable)], check=True)

      - name: Shader cooker DXIL smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($stage in @("vice_lab_cube_vs", "vice_lab_cube_fs")) {
            $manifestPath = "build/cooked/$stage/shader.vice.json"
            $dxilPath = "build/cooked/$stage/shader.dxil"
            if (-not (Test-Path $manifestPath)) {
              throw "The normal build did not cook $stage."
            }
            if (-not (Test-Path $dxilPath)) {
              throw "The normal build did not emit DXIL for $stage."
            }

            $labManifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
            if ($labManifest.version -ne 4) {
              throw "Unexpected VICE Lab shader manifest version: $($labManifest.version)"
            }
            if ($labManifest.artifacts.dxil -ne "shader.dxil") {
              throw "Unexpected VICE Lab DXIL artifact name."
            }
            if ($labManifest.artifacts.metallib -ne $null -or
                $labManifest.artifacts.metal_reflection -ne $null) {
              throw "A Windows VICE Lab cook must not declare Metal artifacts."
            }
            if ($labManifest.reflection.thread_group_size -ne $null) {
              throw "A non-compute VICE Lab shader must not declare compute thread-group metadata."
            }
          }

          $cubeVertexManifest = Get-Content "build/cooked/vice_lab_cube_vs/shader.vice.json" -Raw | ConvertFrom-Json
          $frameData = $cubeVertexManifest.reflection.resources | Where-Object { $_.name -eq "FrameData" }
          if (-not $frameData -or
              $frameData.class -ne "constant_buffer" -or
              $frameData.binding -ne 0 -or
              $frameData.space -ne 0 -or
              $frameData.count -ne 1 -or
              $frameData.unbounded) {
            throw "VICE Lab cube vertex shader did not preserve the b0 FrameData binding."
          }

          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $dxc = Get-ChildItem $sdkRoot -Filter dxc.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\dxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dxc) {
            throw "DXC was not found in the Windows SDK."
          }

          $cooker = Resolve-Path "build/tools/shader_cooker/Release/vice_shader_cooker.exe"
          & $cooker `
            --input "assets/shaders/vice_reflection_fixture.hlsl" `
            --output "build/cooked/vice_reflection_fixture" `
            --entry "vice_reflection_cs" `
            --stage compute `
            --target d3d12 `
            --dxc $dxc.FullName
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $manifestPath = "build/cooked/vice_reflection_fixture/shader.vice.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.version -ne 4) {
            throw "Unexpected shader manifest version: $($manifest.version)"
          }
          if ($manifest.reflection.version -ne 2) {
            throw "Unexpected shader reflection version: $($manifest.reflection.version)"
          }
          $group = $manifest.reflection.thread_group_size
          if (-not $group -or $group.x -ne 1 -or $group.y -ne 1 -or $group.z -ne 1) {
            throw "Compute shader did not preserve authored [numthreads(1,1,1)] metadata."
          }
          if ($manifest.artifacts.metal_reflection -ne $null) {
            throw "A Direct3D 12-only cook must not declare a Metal reflection artifact."
          }
          if ($manifest.metal_binding.version -ne 2 -or
              $manifest.metal_binding.model -ne $null -or
              $manifest.metal_binding.descriptor_entry_size -ne 24 -or
              $manifest.metal_binding.locations.Count -ne 0) {
            throw "Unexpected Metal binding metadata for a Direct3D 12-only cook."
          }
          if ($manifest.reflection.resources.Count -ne 4) {
            throw "Expected four reflected resources, got $($manifest.reflection.resources.Count)."
          }

          function Assert-Resource($name, $class, $binding, $space) {
            $resource = $manifest.reflection.resources | Where-Object { $_.name -eq $name }
            if (-not $resource) {
              throw "Missing reflected resource $name."
            }
            if ($resource.class -ne $class -or
                $resource.kind -ne "generic" -or
                $resource.binding -ne $binding -or
                $resource.space -ne $space -or
                $resource.count -ne 1 -or
                $resource.unbounded) {
              throw "Unexpected reflection for $name."
            }
          }

          Assert-Resource "FrameData" "constant_buffer" 2 1
          Assert-Resource "LinearSampler" "sampler" 3 1
          Assert-Resource "InputTexture" "shader_resource" 4 2
          Assert-Resource "OutputBuffer" "unordered_access" 7 3

          foreach ($probeStage in @(
            @{ Entry = "vice_probe_surface_vs"; Stage = "vertex"; Name = "vertex" },
            @{ Entry = "vice_probe_surface_fs"; Stage = "fragment"; Name = "fragment" }
          )) {
            $output = "build/cooked/vice_probe_surface_$($probeStage.Name)"
            & $cooker `
              --input "assets/shaders/vice_probe_surface_v3.hlsl" `
              --output $output `
              --entry $probeStage.Entry `
              --stage $probeStage.Stage `
              --target d3d12 `
              --dxc $dxc.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          $probeFragment = Get-Content "build/cooked/vice_probe_surface_fragment/shader.vice.json" -Raw | ConvertFrom-Json
          foreach ($binding in 8..16) {
            $resource = $probeFragment.reflection.resources | Where-Object {
              $_.class -eq "shader_resource" -and $_.binding -eq $binding -and $_.space -eq 0
            }
            if (-not $resource) {
              throw "Probe-aware V3 shader is missing environment texture binding t$binding."
            }
          }
          $environmentSampler = $probeFragment.reflection.resources | Where-Object {
            $_.class -eq "sampler" -and $_.binding -eq 2 -and $_.space -eq 0
          }
          if (-not $environmentSampler) {
            throw "Probe-aware V3 shader is missing environment sampler s2."
          }

          foreach ($gpuPbrStage in @(
            @{ Entry = "vice_gpu_pbr_vs"; Stage = "vertex"; Name = "vertex" },
            @{ Entry = "vice_gpu_pbr_fs"; Stage = "fragment"; Name = "fragment" }
          )) {
            $output = "build/cooked/vice_gpu_pbr_$($gpuPbrStage.Name)"
            & $cooker `
              --input "assets/shaders/vice_gpu_pbr_surface.hlsl" `
              --output $output `
              --entry $gpuPbrStage.Entry `
              --stage $gpuPbrStage.Stage `
              --target d3d12 `
              --shader-model 6.6 `
              --dxc $dxc.FullName `
              --force
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          $gpuPbrVertex = Get-Content "build/cooked/vice_gpu_pbr_vertex/shader.vice.json" -Raw | ConvertFrom-Json
          $gpuPbrFragment = Get-Content "build/cooked/vice_gpu_pbr_fragment/shader.vice.json" -Raw | ConvertFrom-Json

          function Assert-GpuPbrBoundResource($reflection, $name, $class, $binding, $space) {
            $resource = $reflection.resources | Where-Object { $_.name -eq $name }
            if (-not $resource) {
              throw "GPU PBR shader is missing reflected resource $name."
            }
            if ($resource.class -ne $class -or
                $resource.binding -ne $binding -or
                $resource.space -ne $space -or
                $resource.count -ne 1 -or
                $resource.unbounded) {
              throw "GPU PBR shader has unexpected reflection for $name."
            }
          }

          Assert-GpuPbrBoundResource $gpuPbrVertex.reflection "SceneFrame" "constant_buffer" 0 0
          Assert-GpuPbrBoundResource $gpuPbrVertex.reflection "scene_models" "shader_resource" 0 0
          Assert-GpuPbrBoundResource $gpuPbrVertex.reflection "visible_scene_instances" "shader_resource" 1 0
          Assert-GpuPbrBoundResource $gpuPbrFragment.reflection "SceneFrame" "constant_buffer" 0 0
          Assert-GpuPbrBoundResource $gpuPbrFragment.reflection "instance_materials" "shader_resource" 2 0
          Assert-GpuPbrBoundResource $gpuPbrFragment.reflection "material_records" "shader_resource" 3 0

          foreach ($arrayResource in @(
            @{ Name = "material_textures"; Class = "shader_resource"; Binding = 0 },
            @{ Name = "material_samplers"; Class = "sampler"; Binding = 0 }
          )) {
            $resource = $gpuPbrFragment.reflection.resources | Where-Object { $_.name -eq $arrayResource.Name }
            if (-not $resource -or
                $resource.class -ne $arrayResource.Class -or
                $resource.binding -ne $arrayResource.Binding -or
                $resource.space -ne 1 -or
                $resource.count -ne 0 -or
                -not $resource.unbounded) {
              throw "GPU PBR shader did not preserve unbounded $($arrayResource.Name) at space1."
            }
          }

          foreach ($binding in 0..24) {
            $resource = $gpuPbrFragment.reflection.resources | Where-Object {
              $_.class -eq "shader_resource" -and $_.binding -eq $binding -and $_.space -eq 2
            }
            if (-not $resource -or $resource.count -ne 1 -or $resource.unbounded) {
              throw "GPU PBR shader is missing bounded lighting resource t$binding,space2."
            }
          }
          foreach ($binding in 0..1) {
            $resource = $gpuPbrFragment.reflection.resources | Where-Object {
              $_.class -eq "sampler" -and $_.binding -eq $binding -and $_.space -eq 2
            }
            if (-not $resource -or $resource.count -ne 1 -or $resource.unbounded) {
              throw "GPU PBR shader is missing bounded lighting sampler s$binding,space2."
            }
          }

          $materialSelectionOutput = "build/cooked/vice_gpu_material_selection_smoke"
          & $cooker `
            --input "assets/shaders/vice_gpu_material_selection_smoke.hlsl" `
            --output $materialSelectionOutput `
            --entry "vice_gpu_material_selection_cs" `
            --stage compute `
            --target d3d12 `
            --shader-model 6.6 `
            --dxc $dxc.FullName `
            --force
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $materialSelectionManifest = Get-Content "$materialSelectionOutput/shader.vice.json" -Raw | ConvertFrom-Json
          $materialTextures = $materialSelectionManifest.reflection.resources | Where-Object {
            $_.name -eq "material_textures"
          }
          $materialSamplers = $materialSelectionManifest.reflection.resources | Where-Object {
            $_.name -eq "material_samplers"
          }
          if (-not $materialTextures -or
              $materialTextures.class -ne "shader_resource" -or
              $materialTextures.binding -ne 0 -or
              $materialTextures.space -ne 1 -or
              $materialTextures.count -ne 0 -or
              -not $materialTextures.unbounded) {
            throw "GPU material selection smoke did not preserve the unbounded texture table."
          }
          if (-not $materialSamplers -or
              $materialSamplers.class -ne "sampler" -or
              $materialSamplers.binding -ne 0 -or
              $materialSamplers.space -ne 1 -or
              $materialSamplers.count -ne 0 -or
              -not $materialSamplers.unbounded) {
            throw "GPU material selection smoke did not preserve the unbounded sampler table."
          }

          $materialSelectionSmoke = Resolve-Path "build/tests/Release/vice_gpu_material_selection_smoke_tests.exe"
          $env:VICE_GPU_MATERIAL_SELECTION_SMOKE_MANIFEST = (Resolve-Path "$materialSelectionOutput/shader.vice.json").Path
          & $materialSelectionSmoke
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
