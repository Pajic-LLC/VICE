name: VICE authored lights patch runner

on:
  push:
    branches:
      - render/authored-lights
    paths:
      - .github/workflows/vice-authored-lights-runner.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: render/authored-lights
      - name: Extract and run patch script
        shell: bash
        run: python3 -c "from pathlib import Path; t=Path('.github/workflows/vice-authored-lights-core-patch.yml').read_text(); s=t.split(\"          python3 - <<'PY'\\n\",1)[1].split(\"\\n          PY\\n\",1)[0]; Path('/tmp/patch.py').write_text('\\n'.join((line[10:] if line.startswith('          ') else line) for line in s.splitlines())+'\\n')" && python3 /tmp/patch.py
      - name: Commit implementation
        shell: bash
        run: rm -f .github/workflows/vice-authored-lights-runner.yml && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add -A && git commit -m 'Add authored World lights and runtime lighting' && git push origin HEAD:render/authored-lights
