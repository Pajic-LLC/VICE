name: Restore VICE Lab vertex guard

on:
  push:
    branches: [render/pbr-textures]
    paths: [.github/vice_lab_restore_patch.py]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render/pbr-textures
          fetch-depth: 0
      - run: python3 .github/vice_lab_restore_patch.py
      - run: |
          rm .github/vice_lab_restore_patch.py
          rm .github/workflows/vice-lab-restore-patch.yml
          git config user.name "VICE Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore VICE Lab with surface vertex guard"
          git push origin HEAD:render/pbr-textures
