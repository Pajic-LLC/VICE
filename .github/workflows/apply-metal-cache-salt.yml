name: Apply Metal explicit cache salt

on:
  push:
    branches:
      - feature/206-metal-explicit-reflection

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Invalidate stale explicit Metal manifests') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/206-metal-explicit-reflection

      - name: Apply cache salt bump
        run: python3 scripts/bump_metal_explicit_cache.py

      - name: Validate patch
        run: git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet -- tools/shader_cooker/src/shader_cooker.cpp; then
            echo "Explicit Metal cache salt already updated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/shader_cooker/src/shader_cooker.cpp
          git commit -m "Invalidate stale explicit Metal manifests"
          git push origin HEAD:feature/206-metal-explicit-reflection
