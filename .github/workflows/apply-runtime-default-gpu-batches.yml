name: Apply default Runtime GPU batches

on:
  push:
    branches:
      - feature/204-runtime-default-gpu-batches

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/204-runtime-default-gpu-batches
      - name: Patch Runtime default GPU batch path
        run: python3 .github/scripts/apply_runtime_default_gpu_batches.py
      - name: Commit Runtime integration
        run: |
          if git diff --quiet -- engine/runtime/src/gpu_draw_batches.cpp engine/runtime/src/scene.cpp; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/runtime/src/gpu_draw_batches.cpp engine/runtime/src/scene.cpp
          git commit -m "Drive default Runtime meshes from GPU batches"
          git push origin HEAD:feature/204-runtime-default-gpu-batches
