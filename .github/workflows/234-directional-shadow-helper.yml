name: Apply #234 directional shadow integration

on:
  push:
    branches:
      - feat/234-gpu-shadow-motion-submit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[directional-shadow-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/234-gpu-shadow-motion-submit
          fetch-depth: 0

      - name: Apply directional shadow integration
        run: python3 .github/scripts/apply_234_directional_shadow.py

      - name: Commit result
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/runtime/src/scene.cpp
          git commit -m "Route directional shadows through GPU indirect batches (#234) [directional-shadow-applied]"
          git push origin HEAD:feat/234-gpu-shadow-motion-submit
