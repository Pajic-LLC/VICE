name: Apply D3D12 compute RHI patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply D3D12 public compute RHI patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/compute-patches/d3d12.part00 \
              .github/compute-patches/d3d12.part01 \
              .github/compute-patches/d3d12.part02 \
              .github/compute-patches/d3d12.part03 \
              .github/compute-patches/d3d12.part04 > /tmp/d3d12-compute.patch

          if git apply --check /tmp/d3d12-compute.patch; then
            git apply /tmp/d3d12-compute.patch
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add engine/render/src/d3d12/rhi.cpp
            git commit -m "Wire D3D12 compute through public RHI"
            git push origin HEAD:${{ github.head_ref }}
          else
            if grep -q 'class D3D12ComputePipeline final' engine/render/src/d3d12/rhi.cpp && \
               grep -q 'bool dispatch(const ComputeDispatchDesc& dispatch_desc) override' engine/render/src/d3d12/rhi.cpp; then
              echo "D3D12 compute RHI patch is already applied."
              exit 0
            fi
            echo "Patch no longer applies cleanly and expected integration markers are absent." >&2
            exit 1
          fi
