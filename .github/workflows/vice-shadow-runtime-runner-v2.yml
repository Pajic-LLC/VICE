name: VICE directional shadow Runtime patch v2

on:
  push:
    branches:
      - render/directional-shadows
    paths:
      - .github/workflows/vice-shadow-runtime-runner-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: render/directional-shadows
          fetch-depth: 0
      - name: Correct shader insertion anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_shadow_runtime.py')
          text = path.read_text()
          start = text.index('# Built-in depth-only shadow vertex shaders.')
          end = text.index('# Shared scene bounds for deterministic shadow fitting.')
          block = r'''# Built-in depth-only shadow vertex shaders.
          replace_once(
              "engine/runtime/src/scene.cpp",
              "[[nodiscard]] constexpr math::Vec3 add(\n",
              """constexpr std::string_view shadow_hlsl_source = R\"(\ncbuffer ShadowFrame : register(b0) {\n    float4x4 view_projection;\n    float4x4 model;\n};\nstruct VertexIn {\n    float3 position : POSITION0;\n};\nfloat4 vice_runtime_shadow_vs(VertexIn input) : SV_Position {\n    const float4 world_position = mul(model, float4(input.position, 1.0));\n    return mul(view_projection, world_position);\n}\n)\";\n\nconstexpr std::string_view shadow_metal_source = R\"(\n#include <metal_stdlib>\nusing namespace metal;\nstruct ShadowFrame {\n    float4x4 view_projection;\n    float4x4 model;\n};\nstruct VertexIn {\n    float3 position [[attribute(11)]];\n};\nvertex float4 vice_runtime_shadow_vs(\n    VertexIn input [[stage_in]],\n    constant ShadowFrame& frame [[buffer(0)]]) {\n    return frame.view_projection * frame.model * float4(input.position, 1.0);\n}\n)\";\n\n[[nodiscard]] constexpr math::Vec3 add(\n""",
          )

          '''
          path.write_text(text[:start] + block + text[end:])
          PY
      - name: Apply Runtime shadow core
        run: python3 .github/scripts/apply_shadow_runtime.py
      - name: Commit Runtime shadow core
        run: |
          rm .github/scripts/apply_shadow_runtime.py
          rm .github/workflows/vice-shadow-runtime-runner.yml
          rm .github/workflows/vice-shadow-runtime-runner-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add directional shadow map generation"
          git push origin HEAD:render/directional-shadows
