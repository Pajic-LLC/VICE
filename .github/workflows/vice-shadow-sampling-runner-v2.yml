name: VICE directional shadow sampling patch v2

on:
  push:
    branches:
      - render/directional-shadows
    paths:
      - .github/workflows/vice-shadow-sampling-runner-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: render/directional-shadows
          fetch-depth: 0
      - name: Correct material sampler anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_shadow_sampling.py')
          text = path.read_text()
          old = '''replace_once(
              "engine/runtime/src/material_pipeline.cpp",
              "        std::unique_ptr<render::Sampler> sampler;\\n",
              "        std::unique_ptr<render::Sampler> sampler;\\n        bool supports_directional_shadow = false;\\n",
          )
          '''
          new = '''replace_once(
              "engine/runtime/src/material_pipeline.cpp",
              """        render::Texture* base_color_texture = nullptr;\\n        std::unique_ptr<render::Sampler> sampler;\\n""",
              """        render::Texture* base_color_texture = nullptr;\\n        std::unique_ptr<render::Sampler> sampler;\\n        bool supports_directional_shadow = false;\\n""",
          )
          '''
          if old not in text:
              raise SystemExit('ambiguous sampler patch block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply shadow sampling
        run: python3 .github/scripts/apply_shadow_sampling.py
      - name: Commit shadow sampling
        run: |
          rm .github/scripts/apply_shadow_sampling.py
          rm .github/workflows/vice-shadow-sampling-runner.yml
          rm .github/workflows/vice-shadow-sampling-runner-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sample directional shadows in project PBR"
          git push origin HEAD:render/directional-shadows
