name: Package Signing

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  sign-and-tamper:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
          - name: Windows x64
            os: windows-2025

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: >-
          cmake -S . -B build
          -DVICE_BUILD_TESTS=OFF
          -DVICE_BUILD_LAB=OFF
          -DVICE_BUILD_EDITOR=OFF
          -DVICE_BUILD_TOOLS=ON
          -DVICE_ENABLE_JOLT_RIGID_BODY=OFF

      - name: Build package tools
        run: cmake --build build --config Release --target vice_player vice_package_signer --parallel

      - name: Sign and tamper macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cp build/apps/vice_player/vice_player build/vice-sign-test

          build/tools/package_signer/vice_package_signer \
            --executable build/vice-sign-test \
            --stamp-asset com.pajic.vice \
            --identity -

          codesign --verify --strict --verbose=2 build/vice-sign-test

          export VICE_SIGN_TEST="$PWD/build/vice-sign-test"
          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["VICE_SIGN_TEST"])
          data = bytearray(path.read_bytes())
          start = b"VICEPKG1"
          end = b"1GKPECIV"
          matches = [
              index
              for index in range(0, len(data) - 319)
              if data[index:index + 8] == start
              and data[index + 312:index + 320] == end
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one VICE package record, found {len(matches)}")
          data[matches[0] + 20] ^= 1
          path.write_bytes(data)
          PY

          if codesign --verify --strict --verbose=2 build/vice-sign-test; then
            echo "Tampered macOS package still passed code signature verification."
            exit 1
          fi

      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows'
        timeout-minutes: 1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $player = Resolve-Path "build/apps/vice_player/Release/vice_player.exe"
          $target = Join-Path $PWD "build/vice-sign-test.exe"
          Copy-Item $player $target -Force

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe was not found in the Windows SDK."
          }

          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
            "CN=VICE CI Package Signing",
            $rsa,
            [System.Security.Cryptography.HashAlgorithmName]::SHA256,
            [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
          )
          $eku = [System.Security.Cryptography.OidCollection]::new()
          [void]$eku.Add([System.Security.Cryptography.Oid]::new("1.3.6.1.5.5.7.3.3"))
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($eku, $false)
          )
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,
              $true
            )
          )

          $cert = $request.CreateSelfSigned(
            [DateTimeOffset]::UtcNow.AddMinutes(-1),
            [DateTimeOffset]::UtcNow.AddHours(1)
          )
          $password = "vice-ci-signing"
          $pfx = Join-Path $PWD "build/vice-ci-signing.pfx"
          $cer = Join-Path $PWD "build/vice-ci-signing.cer"
          [System.IO.File]::WriteAllBytes(
            $pfx,
            $cert.Export(
              [System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,
              $password
            )
          )
          [System.IO.File]::WriteAllBytes(
            $cer,
            $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          )

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $imported = Import-PfxCertificate `
            -FilePath $pfx `
            -Password $securePassword `
            -CertStoreLocation "Cert:\CurrentUser\My"
          Import-Certificate -FilePath $cer -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null

          "VICE_SIGN_TEST=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CERT_SHA1=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Windows package
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $signer = Resolve-Path "build/tools/package_signer/Release/vice_package_signer.exe"
          & $signer `
            --executable $env:VICE_SIGN_TEST `
            --stamp-asset com.pajic.vice `
            --signtool $env:SIGNTOOL_PATH `
            --certificate-sha1 $env:CERT_SHA1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify and tamper Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:SIGNTOOL_PATH verify /pa /all /v $env:VICE_SIGN_TEST
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          @'
          import os
          from pathlib import Path

          path = Path(os.environ["VICE_SIGN_TEST"])
          data = bytearray(path.read_bytes())
          start = b"VICEPKG1"
          end = b"1GKPECIV"
          matches = [
              index
              for index in range(0, len(data) - 319)
              if data[index:index + 8] == start
              and data[index + 312:index + 320] == end
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one VICE package record, found {len(matches)}")
          data[matches[0] + 20] ^= 1
          path.write_bytes(data)
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          & $env:SIGNTOOL_PATH verify /pa /all /v $env:VICE_SIGN_TEST
          if ($LASTEXITCODE -eq 0) {
            throw "Tampered Windows package still passed Authenticode verification."
          }
