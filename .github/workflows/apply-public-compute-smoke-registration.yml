name: Apply public compute smoke registration

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Register public compute smoke test
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/compute-patches/register-public-compute-smoke.patch
          if git apply --check "$patch"; then
            git apply "$patch"
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/CMakeLists.txt
            git commit -m "Register public RHI compute smoke test"
            git push origin HEAD:${{ github.head_ref }}
          else
            if grep -q 'vice_compute_rhi_smoke_tests' tests/CMakeLists.txt; then
              echo "Public compute smoke test is already registered."
              exit 0
            fi
            echo "Smoke test registration patch no longer applies cleanly." >&2
            exit 1
          fi
