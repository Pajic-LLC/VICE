name: Register native depth-only render pass smoke

on:
  push:
    branches:
      - render/directional-shadows
    paths:
      - .github/workflows/vice-shadow-depth-smoke-register.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: render/directional-shadows
          fetch-depth: 0
      - name: Register test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/CMakeLists.txt')
          text = path.read_text()
          old = '''add_executable(vice_depth_state_tests depth_state_tests.cpp)
          target_link_libraries(vice_depth_state_tests PRIVATE VICE::Render)
          target_compile_features(vice_depth_state_tests PRIVATE cxx_std_23)
          vice_enable_warnings(vice_depth_state_tests)
          add_test(NAME vice_depth_state_tests COMMAND vice_depth_state_tests)
          '''
          new = old + '''
          add_executable(vice_depth_only_render_pass_tests depth_only_render_pass_tests.cpp)
          target_link_libraries(vice_depth_only_render_pass_tests PRIVATE VICE::Render)
          target_compile_features(vice_depth_only_render_pass_tests PRIVATE cxx_std_23)
          vice_enable_warnings(vice_depth_only_render_pass_tests)
          add_test(NAME vice_depth_only_render_pass_tests COMMAND vice_depth_only_render_pass_tests)
          '''
          if text.count(old) != 1:
              raise SystemExit('depth state CMake anchor was not unique')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit test registration
        run: |
          rm .github/workflows/vice-shadow-depth-smoke-register.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register native depth-only render pass smoke"
          git push origin HEAD:render/directional-shadows
