name: Apply render residency integration

on:
  push:
    branches:
      - feat/248-render-residency
    paths:
      - .github/workflows/render-residency-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/248-render-residency
          fetch-depth: 0
      - name: Apply guarded integration patch
        run: python3 scripts/apply_render_residency_integration.py
      - name: Remove one-shot helpers
        run: |
          rm scripts/apply_render_residency_integration.py
          rm .github/workflows/render-residency-integration.yml
      - name: Commit Runtime integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate Runtime rendering with World region residency (#248)"
          git push origin HEAD:feat/248-render-residency
