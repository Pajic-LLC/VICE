name: Apply GPU PBR runtime patch

on:
  push:
    branches:
      - feat/229-gpu-pbr-runtime-submit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[gpu-pbr-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/229-gpu-pbr-runtime-submit
          fetch-depth: 0
      - name: Apply renderer and shader integration
        run: python3 .github/scripts/apply_gpu_pbr_runtime_patch.py
      - name: Commit generated integration
        shell: bash
        run: |
          rm .github/scripts/apply_gpu_pbr_runtime_patch.py
          rm .github/workflows/gpu-pbr-runtime-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire GPU PBR indirect runtime submission (#229) [gpu-pbr-patch-applied]"
          git push origin HEAD:feat/229-gpu-pbr-runtime-submit
