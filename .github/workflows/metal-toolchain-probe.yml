name: Metal Toolchain Probe

on:
  pull_request:
    paths:
      - .github/workflows/metal-toolchain-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: macOS 26 Metal toolchain probe
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inspect preinstalled toolchain
        shell: bash
        run: |
          set -uo pipefail
          sw_vers
          xcodebuild -version
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          echo "PATH=$PATH"

          for tool in dxc metal-shaderconverter metal metallib metal-tt; do
            echo "== $tool =="
            command -v "$tool" || true
            xcrun --find "$tool" 2>/dev/null || true
          done

          for path in \
            /usr/local/bin/dxc \
            /usr/local/bin/metal-shaderconverter \
            /opt/metal-shaderconverter/bin/metal-shaderconverter \
            /opt/metal-shaderconverter/metal-shaderconverter; do
            if [[ -e "$path" ]]; then
              ls -l "$path"
            fi
          done

      - name: Install Xcode Metal toolchain component
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -downloadComponent MetalToolchain

      - name: Inspect downloaded component
        shell: bash
        run: |
          set -uo pipefail
          for tool in dxc metal-shaderconverter metal metallib metal-tt; do
            echo "== $tool =="
            command -v "$tool" || true
            xcrun --find "$tool" 2>/dev/null || true
          done

          echo "== installed packages =="
          pkgutil --pkgs | grep -Ei 'metal|shader|converter' || true

          for path in \
            /usr/local/bin/dxc \
            /usr/local/bin/metal-shaderconverter \
            /opt/metal-shaderconverter/bin/metal-shaderconverter \
            /opt/metal-shaderconverter/metal-shaderconverter; do
            if [[ -e "$path" ]]; then
              ls -l "$path"
            fi
          done

          if command -v metal-shaderconverter >/dev/null 2>&1; then
            metal-shaderconverter --version || metal-shaderconverter --help | head -40
          elif xcrun --find metal-shaderconverter >/dev/null 2>&1; then
            xcrun metal-shaderconverter --version || xcrun metal-shaderconverter --help | head -40
          fi
