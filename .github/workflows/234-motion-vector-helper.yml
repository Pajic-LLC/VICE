name: Apply #234 GPU motion-vector integration

on:
  push:
    branches:
      - feat/234-gpu-motion-vectors

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[motion-vector-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/234-gpu-motion-vectors
          fetch-depth: 0

      - name: Apply motion-vector integration
        run: python3 .github/scripts/apply_234_motion_vectors.py

      - name: Commit result
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/runtime/src/scene.cpp
          git commit -m "Route motion vectors through GPU indirect batches (#234) [motion-vector-applied]"
          git push origin HEAD:feat/234-gpu-motion-vectors
