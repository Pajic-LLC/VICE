name: VICE cascaded shadow runtime patch

on:
  push:
    branches:
      - render/cascaded-directional-shadows
    paths:
      - .github/workflows/vice-csm-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: render/cascaded-directional-shadows
          fetch-depth: 0
      - name: Apply cascaded shadow runtime patch
        run: python3 .github/scripts/apply_csm_runtime.py
      - name: Validate patch
        run: git diff --check
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/runtime/src/scene.cpp engine/runtime/src/material_pipeline.cpp tests/runtime_scene_tests.cpp
          git commit -m "Implement stabilized cascaded directional shadows"
          git push origin HEAD:render/cascaded-directional-shadows
