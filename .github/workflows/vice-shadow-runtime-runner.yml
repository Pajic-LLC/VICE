name: VICE directional shadow Runtime patch

on:
  push:
    branches:
      - render/directional-shadows
    paths:
      - .github/scripts/apply_shadow_runtime.py
      - .github/workflows/vice-shadow-runtime-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: render/directional-shadows
          fetch-depth: 0
      - name: Apply Runtime shadow core
        run: python3 .github/scripts/apply_shadow_runtime.py
      - name: Commit Runtime shadow core
        run: |
          rm .github/scripts/apply_shadow_runtime.py
          rm .github/workflows/vice-shadow-runtime-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add directional shadow map generation"
          git push origin HEAD:render/directional-shadows
