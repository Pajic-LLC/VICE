name: Apply 206 Metal backend

on:
  push:
    branches:
      - feature/206-metal-unbounded-descriptors

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/206-metal-unbounded-descriptors
      - name: Apply Metal backend layer
        run: python3 .github/scripts/apply_206_metal_backend.py
      - name: Commit layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render/src/metal/rhi.mm \
                  engine/render/src/metal/compute_pipeline.mm \
                  tests/metal_compute_pipeline_tests.mm
          git diff --cached --quiet || git commit -m "Materialize Metal explicit descriptor tables"
          if git log -1 --pretty=%an | grep -q 'github-actions'; then
            git push
          fi
