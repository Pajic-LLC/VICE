name: Fix shader kind smoke

on:
  push:
    branches:
      - feat/309-shader-resource-kinds

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/309-shader-resource-kinds
          fetch-depth: 0

      - name: Patch CI smoke assertion
        run: python3 .github/patch_shader_kind_smoke.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/ci.yml; then
            echo "No CI smoke patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Update shader reflection smoke for resource kinds"
          git push origin HEAD:feat/309-shader-resource-kinds
