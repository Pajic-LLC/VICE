name: VICE directional shadow sampling patch

on:
  push:
    branches:
      - render/directional-shadows
    paths:
      - .github/scripts/apply_shadow_sampling.py
      - .github/workflows/vice-shadow-sampling-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: render/directional-shadows
          fetch-depth: 0
      - name: Apply shadow sampling
        run: python3 .github/scripts/apply_shadow_sampling.py
      - name: Commit shadow sampling
        run: |
          rm .github/scripts/apply_shadow_sampling.py
          rm .github/workflows/vice-shadow-sampling-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sample directional shadows in project PBR"
          git push origin HEAD:render/directional-shadows
