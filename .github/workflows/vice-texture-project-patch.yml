name: VICE project texture patch

on:
  push:
    branches: [render/pbr-textures]
    paths: [.github/vice_texture_project_patch.py]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render/pbr-textures
      - run: python3 .github/vice_texture_project_patch.py
      - run: |
          rm .github/vice_texture_project_patch.py
          rm .github/workflows/vice-texture-project-patch.yml
          git config user.name "VICE Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Cook and stage project textures"
          git push origin HEAD:render/pbr-textures
