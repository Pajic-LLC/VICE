name: Apply GPU material selection smoke patch

on:
  push:
    branches:
      - test/232-gpu-material-selection-smoke

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[gpu-material-smoke-applied]') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/232-gpu-material-selection-smoke
          fetch-depth: 0
      - name: Apply test and CI integration
        run: python3 .github/scripts/apply_gpu_material_selection_smoke.py
      - name: Commit generated integration
        shell: bash
        run: |
          rm .github/scripts/apply_gpu_material_selection_smoke.py
          rm .github/workflows/gpu-material-selection-smoke-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire GPU material selection execution smoke (#232) [gpu-material-smoke-applied]"
          git push origin HEAD:test/232-gpu-material-selection-smoke
