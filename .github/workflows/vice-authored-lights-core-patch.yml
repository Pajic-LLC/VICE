name: VICE authored lights core patch

on:
  push:
    branches: [render/authored-lights]
    paths: [.github/workflows/vice-authored-lights-core-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: render/authored-lights
      - name: Apply core authored light implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'pattern not unique in {path}: count={text.count(old)}')
              write(path, text.replace(old, new, 1))

          def replace_all(path, old, new, expected):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'pattern count in {path}: expected {expected}, got {count}')
              write(path, text.replace(old, new))

          write('engine/world/include/vice/world/light.hpp', r'''#pragma once

#include <cmath>
#include <cstdint>

namespace vice::world {

enum class LightType : std::uint8_t {
    directional = 1,
    point = 2,
};

struct LightColor {
    float red = 1.0F;
    float green = 1.0F;
    float blue = 1.0F;

    friend bool operator==(const LightColor&, const LightColor&) = default;
};

struct Light {
    LightType type = LightType::directional;
    LightColor color{};
    float intensity = 1.0F;
    float range = 0.0F;
    bool enabled = true;

    friend bool operator==(const Light&, const Light&) = default;
};

[[nodiscard]] inline bool valid(const Light& light) noexcept {
    if (light.type != LightType::directional && light.type != LightType::point) return false;
    if (!std::isfinite(light.color.red) || !std::isfinite(light.color.green) ||
        !std::isfinite(light.color.blue) || light.color.red < 0.0F ||
        light.color.green < 0.0F || light.color.blue < 0.0F ||
        !std::isfinite(light.intensity) || light.intensity < 0.0F ||
        !std::isfinite(light.range) || light.range < 0.0F) {
        return false;
    }
    return light.type != LightType::point || light.range > 0.0F;
}

} // namespace vice::world
''')

