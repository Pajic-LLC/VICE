name: Export compute sources

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload backend sources
        uses: actions/upload-artifact@v4
        with:
          name: compute-backend-sources
          path: |
            engine/render/src/d3d12/rhi.cpp
            engine/render/src/metal/rhi.mm
            engine/render/CMakeLists.txt
          if-no-files-found: error
