name: VICE directional shadow Runtime patch v4

on:
  push:
    branches:
      - render/directional-shadows
    paths:
      - .github/workflows/vice-shadow-runtime-runner-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: render/directional-shadows
          fetch-depth: 0
      - name: Correct Runtime patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_shadow_runtime.py')
          text = path.read_text()
          text = text.replace(
              'raise RuntimeError(f"{path}: expected one anchor, found {count}")',
              'raise RuntimeError(f"{path}: expected one anchor, found {count}; anchor={old[:220]!r}")',
              1,
          )

          start = text.index('# Built-in depth-only shadow vertex shaders.')
          end = text.index('# Shared scene bounds for deterministic shadow fitting.')
          shader_block = r'''# Built-in depth-only shadow vertex shaders.
          replace_once(
              "engine/runtime/src/scene.cpp",
              "[[nodiscard]] constexpr math::Vec3 add(\n",
              """constexpr std::string_view shadow_hlsl_source = R\"(\ncbuffer ShadowFrame : register(b0) {\n    float4x4 view_projection;\n    float4x4 model;\n};\nstruct VertexIn {\n    float3 position : POSITION0;\n};\nfloat4 vice_runtime_shadow_vs(VertexIn input) : SV_Position {\n    const float4 world_position = mul(model, float4(input.position, 1.0));\n    return mul(view_projection, world_position);\n}\n)\";\n\nconstexpr std::string_view shadow_metal_source = R\"(\n#include <metal_stdlib>\nusing namespace metal;\nstruct ShadowFrame {\n    float4x4 view_projection;\n    float4x4 model;\n};\nstruct VertexIn {\n    float3 position [[attribute(11)]];\n};\nvertex float4 vice_runtime_shadow_vs(\n    VertexIn input [[stage_in]],\n    constant ShadowFrame& frame [[buffer(0)]]) {\n    return frame.view_projection * frame.model * float4(input.position, 1.0);\n}\n)\";\n\n[[nodiscard]] constexpr math::Vec3 add(\n""",
          )

          '''
          text = text[:start] + shader_block + text[end:]

          start = text.index('# Dedicated shadow constant buffer.')
          end = text.index('# Runtime shadow-light selection and fitted directional view.')
          constants_block = r'''# Dedicated shadow constant buffer.
          replace_once(
              "engine/runtime/src/scene.cpp",
              "[[nodiscard]] float mesh_radius(",
              """[[nodiscard]] std::unique_ptr<render::Buffer> create_shadow_constant_buffer(\n    render::Device& device\n) {\n    render::BufferDesc desc;\n    desc.size = sizeof(ShadowConstants);\n    desc.usage = render::BufferUsage::uniform;\n    desc.memory = render::MemoryLocation::cpu_to_gpu;\n    desc.debug_name = \"VICE Runtime shadow constants\";\n    return device.create_buffer(desc);\n}\n\n[[nodiscard]] float mesh_radius(""",
          )

          '''
          text = text[:start] + constants_block + text[end:]
          path.write_text(text)
          PY
      - name: Apply Runtime shadow core
        run: python3 .github/scripts/apply_shadow_runtime.py
      - name: Commit Runtime shadow core
        run: |
          rm .github/scripts/apply_shadow_runtime.py
          rm .github/workflows/vice-shadow-runtime-runner.yml
          rm .github/workflows/vice-shadow-runtime-runner-v2.yml
          rm .github/workflows/vice-shadow-runtime-diagnose.yml
          rm .github/workflows/vice-shadow-runtime-runner-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add directional shadow map generation"
          git push origin HEAD:render/directional-shadows
