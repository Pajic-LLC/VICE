name: VICE authored light fixture fix

on:
  push:
    branches:
      - render/authored-lights
    paths:
      - .github/workflows/vice-authored-lights-fixture-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: render/authored-lights
      - name: Fix snapshot source fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/world_snapshot_file_tests.cpp')
          text = path.read_text()
          old = 'entity 10000000-0000-4000-8000-000000000001 spatial 5 1 0 1 camera perspective 72 0.1 750 primary\n'
          new = 'entity 10000000-0000-4000-8000-000000000001 spatial 5 1 0 1 camera perspective 72 0.1 750 primary light directional 1 0.9 0.8 2.5 enabled\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one source fixture line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fixture correction
        shell: bash
        run: rm -f .github/workflows/vice-authored-lights-fixture-fix.yml && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add -A && git commit -m 'Fix authored light snapshot fixture' && git push origin HEAD:render/authored-lights
