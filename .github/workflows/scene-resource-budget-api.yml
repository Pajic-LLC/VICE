name: Apply renderer resource budget API

on:
  push:
    branches:
      - feat/250-resource-budgets
    paths:
      - scripts/apply_scene_resource_budget_api.py
      - .github/workflows/scene-resource-budget-api.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/250-resource-budgets
          fetch-depth: 0
      - name: Apply guarded renderer budget API patch
        run: python3 scripts/apply_scene_resource_budget_api.py
      - name: Remove one-shot helpers
        run: |
          rm scripts/apply_scene_resource_budget_api.py
          rm .github/workflows/scene-resource-budget-api.yml
      - name: Commit renderer budget API
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/runtime/include/vice/runtime/scene.hpp scripts/apply_scene_resource_budget_api.py .github/workflows/scene-resource-budget-api.yml
          git commit -m "Expose Runtime resource residency budgets (#250)"
          git push origin HEAD:feat/250-resource-budgets
