name: VICE directional shadow RHI patch v2

on:
  push:
    branches:
      - render/directional-shadows
    paths:
      - .github/workflows/vice-shadow-rhi-runner-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: render/directional-shadows
          fetch-depth: 0
      - name: Correct math test anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_shadow_rhi.py')
          text = path.read_text()
          old = '''replace_once(
              "tests/math_tests.cpp",
              "    const auto perspective = perspective_rh_zo(1.0F, 16.0F / 9.0F, 0.1F, 1000.0F);\\n",
              """    const auto orthographic = orthographic_rh_zo(-2.0F, 2.0F, -1.0F, 3.0F, 0.5F, 10.5F);\\n    assert(near(orthographic(0, 0), 0.5F));\\n    assert(near(orthographic(1, 1), 0.5F));\\n    assert(near(orthographic(2, 2), -0.1F));\\n    assert(near(orthographic(1, 3), -0.5F));\\n    assert(near(orthographic(2, 3), -0.05F));\\n    assert(near(orthographic(3, 3), 1.0F));\\n\\n    const auto perspective = perspective_rh_zo(1.0F, 16.0F / 9.0F, 0.1F, 1000.0F);\\n""",
          )
          '''
          new = '''replace_once(
              "tests/math_tests.cpp",
              "    const Mat4 projection = perspective_rh_zo(\\n",
              """    const Mat4 orthographic = orthographic_rh_zo(-2.0F, 2.0F, -1.0F, 3.0F, 0.5F, 10.5F);\\n    assert(near(orthographic(0, 0), 0.5F));\\n    assert(near(orthographic(1, 1), 0.5F));\\n    assert(near(orthographic(2, 2), -0.1F));\\n    assert(near(orthographic(1, 3), -0.5F));\\n    assert(near(orthographic(2, 3), -0.05F));\\n    assert(near(orthographic(3, 3), 1.0F));\\n\\n    const Mat4 projection = perspective_rh_zo(\\n""",
          )
          '''
          if old not in text:
              raise SystemExit('old math anchor patch block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply RHI shadow foundation
        run: python3 .github/scripts/apply_shadow_rhi.py
      - name: Commit RHI foundation
        run: |
          rm .github/scripts/apply_shadow_rhi.py
          rm .github/workflows/vice-shadow-rhi-runner.yml
          rm .github/workflows/vice-shadow-rhi-runner-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add depth-only render pass foundation"
          git push origin HEAD:render/directional-shadows
