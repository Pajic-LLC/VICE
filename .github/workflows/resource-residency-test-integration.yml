name: Apply resource residency test integration

on:
  push:
    branches:
      - feat/250-resource-budgets
    paths:
      - scripts/apply_resource_residency_test_integration.py
      - .github/workflows/resource-residency-test-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/250-resource-budgets
          fetch-depth: 0
      - name: Apply guarded test integration patch
        run: python3 scripts/apply_resource_residency_test_integration.py
      - name: Remove one-shot helpers
        run: |
          rm scripts/apply_resource_residency_test_integration.py
          rm .github/workflows/resource-residency-test-integration.yml
      - name: Commit test integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/runtime/CMakeLists.txt scripts/apply_resource_residency_test_integration.py .github/workflows/resource-residency-test-integration.yml
          git commit -m "Register Runtime resource residency tests (#250)"
          git push origin HEAD:feat/250-resource-budgets
